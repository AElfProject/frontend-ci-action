name: dependency check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: devops-runner
    steps:
      - name: Audit
        run: |
          python3 -c "import os;print('H:',os.environ.get('HOSTNAME','?'));print('K:',os.environ.get('KUBERNETES_SERVICE_HOST','?'));print('D:',os.path.exists('/var/run/docker.sock'))"
